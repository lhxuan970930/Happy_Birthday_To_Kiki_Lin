<style>
*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}
:root {

--navy-mid: #0c1631;

html, body {
width: 100%;
height: 100%;
overflow: hidden;

height: 100%;

}

inset: 0;
pointer-events: none;
z-index: 1;

radial-gradient(circle at 82% 22%, rgba(243, 217, 164, 0.09) 0%, rgba(243, 217, 164, 0) 42%),
radial-gradient(circle at 18% 82%, rgba(92, 124, 196, 0.10) 0%, rgba(92, 124, 196, 0) 48%);

inset: 0;
z-index: 3;
display: flex;
flex-direction: column;
justify-content: space-between;

.site-header {

align-items: center;

width: 100%;

0 28px 70px rgba(3, 7, 18, 0.62),

height: 46px;

.title {

font-size: clamp(24px, 4vw, 29px);

letter-spacing: 0.12em;

.google-icon {
width: 17px;
height: 17px;

margin-top: 16px;
font-size: 11.5px;

letter-spacing: 0.05em;

font-size: 12px;

.status.error {
color: var(--err);
}

.site-footer {
display: flex;
align-items: center;
justify-content: space-between;
padding-top: 14px;
border-top: 1px solid var(--line);
font-size: 12px;
color: rgba(243, 234, 216, 0.45);

}
.footer-left {
font-size: 11px;
letter-spacing: 0.14em;

}
.footer-sign {
font-family: var(--italic);
font-style: italic;
font-size: 15px;
color: rgba(243, 217, 164, 0.68);
letter-spacing: 0.04em;
}
@media (max-width: 520px) {
.card {
padding: 32px 22px 28px;
}
.site-footer {
flex-direction: column;
align-items: flex-end;
gap: 4px;
}

</div>

<path fill="currentColor" d="M12 22c2.75 0 5.06-.91 6.75-2.47l-3.3-2.56c-.91.61-2.08.98-3.45.98-2.66 0-4.91-1.8-5.72-4.21H2.87v2.64A10.2 10.2 0 0 0 12 22z"/>
<path fill="currentColor" d="M6.28 13.74a6.12 6.12 0 0 1 0-3.48V7.62H2.87a10.2 10.2 0 0 0 0 8.76l3.41-2.64z"/>
<path fill="currentColor" d="M12 6.05c1.5 0 2.84.51 3.9 1.52l2.92-2.92C17.05 2.99 14.75 2 12 2a10.2 10.2 0 0 0-9.13 5.62l3.41 2.64C7.09 7.85 9.34 6.05 12 6.05z"/>

<script>
(() => {
'use strict';
// =========================================================================
// 1. Firebase 共用設定（與聖誕網頁共用同一個 for-kiki 專案）
// =========================================================================
const FIREBASE_CONFIG = {
apiKey: 'AIzaSyA-MFtQOYzJNxCx9I98ERcwRgoOFO1Zpr4',
authDomain: 'for-kiki.firebaseapp.com',
projectId: 'for-kiki',
storageBucket: 'for-kiki.firebasestorage.app',
messagingSenderId: '1079956903157',
appId: '1:1079956903157:web:fb10e1ffac2d15ccf0e1bc',
measurementId: 'G-N8K6PWLYKS'
};
const ALLOWED_EMAILS = [
'linkiki971101@gmail.com',
'lhxuan970930@gmail.com'
];
// Firestore 文件僅存放 44 字元的 AES-256 解密金鑰（遠小於 1MB 上限）
const VAULT_COLLECTION = 'private_pages';
const VAULT_DOC_ID = '2026 happy birthday';
const VAULT_KEY_FIELD = 'key';
const ENCRYPTED_VAULT_URL = './birthday_vault.enc';
// =========================================================================
// 2. 浪漫深藍星空與細緻軌道線動態背景
// =========================================================================
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
let stars = [];
let sparkles = [];
let animRunning = true;
function resizeCanvas() {
const dpr = Math.min(window.devicePixelRatio || 1, 2);
W = window.innerWidth;
H = window.innerHeight;
canvas.width = Math.floor(W * dpr);
canvas.height = Math.floor(H * dpr);
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
stars = [];
const count = Math.min(130, Math.max(65, Math.floor((W * H) / 11000)));
for (let i = 0; i < count; i++) {
stars.push({
x: Math.random() * W,
y: Math.random() * H,
r: 0.6 + Math.random() * 1.45,
phase: Math.random() * Math.PI * 2,
speed: 0.6 + Math.random() * 1.4,
warm: Math.random() < 0.72
});
}
sparkles = [];
for (let i = 0; i < 10; i++) {
sparkles.push({
x: (0.08 + Math.random() * 0.84) * W,
y: (0.12 + Math.random() * 0.76) * H,
size: 4 + Math.random() * 5,
phase: Math.random() * Math.PI * 2
});
}
}
function drawFourPointStar(x, y, size, alpha) {
ctx.save();
ctx.translate(x, y);
ctx.fillStyle = ⁠rgba(243, 217, 164, ${alpha.toFixed(3)})⁠;
ctx.beginPath();
ctx.moveTo(0, -size);
ctx.quadraticCurveTo(0, 0, size, 0);
ctx.quadraticCurveTo(0, 0, 0, size);
ctx.quadraticCurveTo(0, 0, -size, 0);
ctx.quadraticCurveTo(0, 0, 0, -size);
ctx.closePath();
ctx.fill();
ctx.restore();
}
function drawSky(now) {
if (!animRunning) return;
requestAnimationFrame(drawSky);
const t = now * 0.001;
ctx.clearRect(0, 0, W, H);
ctx.save();
ctx.translate(W * 0.5, H * 0.5);
const baseR = Math.min(W, H) * 0.44;
ctx.strokeStyle = 'rgba(243, 217, 164, 0.08)';
ctx.lineWidth = 1;
ctx.save();
ctx.rotate(-0.28 + Math.sin(t * 0.12) * 0.02);
ctx.beginPath();
ctx.ellipse(0, 0, baseR * 1.32, baseR * 0.54, 0, 0, Math.PI * 2);
ctx.stroke();
ctx.restore();
ctx.save();
ctx.rotate(0.36 - Math.cos(t * 0.1) * 0.02);
ctx.strokeStyle = 'rgba(243, 217, 164, 0.055)';
ctx.beginPath();
ctx.ellipse(0, 0, baseR * 1.12, baseR * 0.78, 0, 0, Math.PI * 2);
ctx.stroke();
ctx.restore();
ctx.restore();
for (let i = 0; i < stars.length; i++) {
const s = stars[i];
const a = 0.22 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
ctx.fillStyle = s.warm
? ⁠rgba(243, 217, 164, ${a.toFixed(3)})⁠
: ⁠rgba(220, 232, 255, ${(a * 0.75).toFixed(3)})⁠;
ctx.beginPath();
ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
ctx.fill();
}
for (let i = 0; i < sparkles.length; i++) {
const sp = sparkles[i];
const a = 0.15 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.3 + sp.phase));
drawFourPointStar(sp.x, sp.y, sp.size, a);
}
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
requestAnimationFrame(drawSky);
// =========================================================================
// 3. AES-256-GCM + Gzip 瀏覽器端解密工具
// =========================================================================
function base64ToBytes(b64) {
const bin = atob(b64.trim());
const out = new Uint8Array(bin.length);
for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
return out;
}
async function gunzipToString(gzUint8) {
const ds = new DecompressionStream('gzip');
const stream = new Blob([gzUint8]).stream().pipeThrough(ds);
return await new Response(stream).text();
}
async function decryptVault(encBuffer, keyB64) {
const encBytes = new Uint8Array(encBuffer);
if (encBytes.byteLength < 29) {
throw new Error('VAULT_CORRUPT');
}
const iv = encBytes.slice(0, 12);
const ciphertext = encBytes.slice(12);
const rawKey = base64ToBytes(keyB64);
const cryptoKey = await crypto.subtle.importKey(
'raw',
rawKey,
{ name: 'AES-GCM' },
false,
['decrypt']
);
const plainGz = await crypto.subtle.decrypt(
{ name: 'AES-GCM', iv },
cryptoKey,
ciphertext
);
return await gunzipToString(new Uint8Array(plainGz));
}
// 在解密後的原始網頁右下角附加上一顆低調的登出按鈕
function injectSignOutButton(htmlSource) {
const btnSnippet = ⁠ &lt;button id=&quot;vault-signout-btn&quot; type=&quot;button&quot; onclick=&quot;location.href=location.pathname+&#39;?signout=1&#39;&quot; style=&quot;position:fixed;bottom:14px;right:16px;z-index:99999;padding:6px 14px;border-radius:999px;border:1px solid rgba(243,217,164,0.42);background:rgba(11,19,43,0.72);color:#f3d9a4;font-family:-apple-system,BlinkMacSystemFont,&#39;Noto Sans TC&#39;,sans-serif;font-size:11px;letter-spacing:0.1em;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);&quot;&gt; 登出 &lt;/button&gt;⁠;
const idx = htmlSource.lastIndexOf('</body>');
if (idx !== -1) {
return htmlSource.slice(0, idx) + btnSnippet + htmlSource.slice(idx);
}
return htmlSource + btnSnippet;
}
function mountProtectedHtml(htmlSource) {
animRunning = false;
window.removeEventListener('resize', resizeCanvas);
const finalHtml = injectSignOutButton(htmlSource);
document.open('text/html', 'replace');
document.write(finalHtml);
document.close();
}
// =========================================================================
// 4. DOM 與 Firebase Google 第三方驗證
// =========================================================================
const statusPillText = document.getElementById('statusPillText');
const googleSignInBtn = document.getElementById('googleSignInBtn');
const btnLabel = document.getElementById('btnLabel');
const statusMsg = document.getElementById('statusMsg');
function setStatus(text, type = '') {
statusMsg.textContent = text;
statusMsg.className = 'status' + (type ? ' ' + type : '');
}
function setBusy(busy) {
googleSignInBtn.disabled = busy;
btnLabel.textContent = busy ? '驗證中...' : '使用 Google 帳號進入 →';
}
const sdkReady = typeof window.firebase !== 'undefined';
let auth = null;
let db = null;
let googleProvider = null;
let unlocking = false;
if (sdkReady) {
try {
if (!window.firebase.apps.length) {
window.firebase.initializeApp(FIREBASE_CONFIG);
}
auth = window.firebase.auth();
db = window.firebase.firestore();
googleProvider = new window.firebase.auth.GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });
} catch (err) {
setStatus('Firebase 初始化失敗，請重新整理再試。', 'error');
}
}
async function verifyAndLoadVault(user) {
if (!user || !user.email || unlocking) return;
const emailLower = user.email.trim().toLowerCase();
if (!ALLOWED_EMAILS.some((e) => e.trim().toLowerCase() === emailLower)) {
await auth.signOut();
setBusy(false);
statusPillText.textContent = '尚未驗證';
setStatus('此 Google 帳號不在受邀名單內，請切換為授權帳號。', 'error');
return;
}
unlocking = true;
setBusy(true);
statusPillText.textContent = '驗證通過';
setStatus('身分確認完成，正在解密專屬網頁...', 'ok');
try {
const snap = await db.collection(VAULT_COLLECTION).doc(VAULT_DOC_ID).get();
const data = snap.exists ? snap.data() : null;
const keyB64 = data && typeof data[VAULT_KEY_FIELD] === 'string' ? data[VAULT_KEY_FIELD].trim() : '';
if (!keyB64) {
unlocking = false;
await auth.signOut();
setBusy(false);
statusPillText.textContent = '尚未驗證';
setStatus('尚未在 Firestore 的 private_pages / 2026 happy birthday 建立 key 欄位。', 'error');
return;
}
const res = await fetch(ENCRYPTED_VAULT_URL, { cache: 'no-store' });
if (!res.ok) {
unlocking = false;
setBusy(false);
statusPillText.textContent = '載入失敗';
setStatus('找不到 birthday_vault.enc，請確認已和 index.html 一起上傳到 GitHub 倉庫。', 'error');
return;
}
const encBuffer = await res.arrayBuffer();
const htmlSource = await decryptVault(encBuffer, keyB64);
mountProtectedHtml(htmlSource);
} catch (err) {
unlocking = false;
setBusy(false);
statusPillText.textContent = '尚未驗證';
const code = err && err.code ? err.code : (err && err.name ? err.name : 'unknown');
if (code === 'permission-denied') {
await auth.signOut();
setStatus('Firestore 權限規則拒絕讀取，請確認已發布 firestore.rules。', 'error');
} else if (code === 'OperationError') {
setStatus('解密失敗：Firestore 的 key 欄位與 birthday_vault.enc 不符，請重新核對金鑰。', 'error');
} else {
setStatus(⁠內容載入失敗（${code}）。⁠, 'error');
}
}
}
// 處理從內頁點選「登出」導回的 ?signout=1
const params = new URLSearchParams(window.location.search);
const wantsSignOut = params.get('signout') === '1';
if (auth) {
if (wantsSignOut) {
history.replaceState(null, '', window.location.pathname);
auth.signOut().finally(() => {
setStatus('已登出。', '');
auth.onAuthStateChanged((user) => {
if (user) verifyAndLoadVault(user);
});
});
} else {
auth.getRedirectResult().catch(() => {});
auth.onAuthStateChanged((user) => {
if (user) verifyAndLoadVault(user);
});
}
}
googleSignInBtn.addEventListener('click', async () => {
if (window.location.protocol === 'file:') {
setStatus('請透過 GitHub Pages（https://）開啟網頁，本機 file:// 無法執行 Google 驗證。', 'error');
return;
}
if (!sdkReady || !auth || !db || !googleProvider) {
setStatus('驗證服務尚未就緒，請檢查網路連線後重試。', 'error');
return;
}
setBusy(true);
statusPillText.textContent = '驗證中...';
setStatus('正在開啟 Google 驗證視窗...', '');
try {
const cred = await auth.signInWithPopup(googleProvider);
await verifyAndLoadVault(cred.user);
} catch (err) {
const code = err && err.code ? err.code : '';
if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment') {
try {
setStatus('正在跳轉至 Google 驗證頁面...', '');
await auth.signInWithRedirect(googleProvider);
return;
} catch (_) {}
}
setBusy(false);
statusPillText.textContent = '尚未驗證';
if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
setStatus('已取消登入。', '');
} else if (code === 'auth/unauthorized-domain') {
setStatus(⁠尚未授權此網域（${window.location.hostname}），請到 Firebase Authorized domains 新增。⁠, 'error');
} else if (code === 'auth/operation-not-allowed') {
setStatus('Firebase 尚未啟用 Google 登入，請到 Sign-in method 開啟。', 'error');
} else {
setStatus(⁠Google 驗證失敗（${code || &#39;unknown&#39;}）。⁠, 'error');
}
}
});
})();
</script>
